<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#1a1a2e"/>
  <!-- Cat head -->
  <ellipse cx="256" cy="280" rx="140" ry="130" fill="#F97316"/>
  <!-- Ears -->
  <polygon points="140,200 175,90 220,180" fill="#F97316"/>
  <polygon points="372,200 337,90 292,180" fill="#F97316"/>
  <polygon points="155,185 175,120 200,175" fill="#FB923C"/>
  <polygon points="357,185 337,120 312,175" fill="#FB923C"/>
  <!-- Angry eyebrows -->
  <polygon points="175,235 245,255 245,270 175,255" fill="#1a1a2e"/>
  <polygon points="337,235 267,255 267,270 337,255" fill="#1a1a2e"/>
  <!-- Eyes -->
  <circle cx="210" cy="280" r="22" fill="#1a1a2e"/>
  <circle cx="302" cy="280" r="22" fill="#1a1a2e"/>
  <circle cx="216" cy="274" r="7" fill="#fff"/>
  <circle cx="308" cy="274" r="7" fill="#fff"/>
  <!-- Nose -->
  <polygon points="256,305 242,320 270,320" fill="#1a1a2e"/>
  <!-- Mouth - determined frown -->
  <path d="M256 320 L256 340" stroke="#1a1a2e" stroke-width="4" fill="none"/>
  <path d="M256 340 Q230 355 215 345" stroke="#1a1a2e" stroke-width="4" fill="none"/>
  <path d="M256 340 Q282 355 297 345" stroke="#1a1a2e" stroke-width="4" fill="none"/>
  <!-- Whiskers -->
  <line x1="130" y1="310" x2="190" y2="315" stroke="#1a1a2e" stroke-width="3"/>
  <line x1="130" y1="330" x2="190" y2="325" stroke="#1a1a2e" stroke-width="3"/>
  <line x1="382" y1="310" x2="322" y2="315" stroke="#1a1a2e" stroke-width="3"/>
  <line x1="382" y1="330" x2="322" y2="325" stroke="#1a1a2e" stroke-width="3"/>
</svg>
